# Netlify Configuration for ElevenLabs Voice Studio

[build]
  # Publish root folder containing static HTML, CSS, and JS
  publish = "."
  # Netlify serverless functions directory
  functions = "netlify/functions"

# Local Development Settings for Netlify CLI (`netlify dev`)
[dev]
  publish = "."
  functions = "netlify/functions"
  framework = "#static"
  port = 8888
  autoLaunch = false

# API route mapping (supports both /.netlify/functions/generate-speech and /api/generate-speech)
[[redirects]]
  from = "/api/generate-speech"
  to = "/.netlify/functions/generate-speech"
  status = 200
  force = true

# Global Security & Caching Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
